name: app
services:
  payment-service:
    restart: unless-stopped
    cap_drop:
      - ALL
    environment:
      SERVICE_VERSION: 36a3725d9b201e868f9e2e18d1c07180a12502df
    env_file:
      - path: /opt/flash-ticket-app/env-t062/payment-service.env
    image: ft-local/payment-service:arm64-t067-36a3725d
    logging:
      driver: json-file
      options:
        labels: com.docker.compose.service,com.docker.compose.container-number
        max-file: "3"
        max-size: 10m
    mem_limit: "1073741824"
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    user: 10001:10001
