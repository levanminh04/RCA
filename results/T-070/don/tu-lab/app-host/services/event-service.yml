services:
  event-service:
    extends:
      file: _common.yml
      service: common
    image: ${IMAGE:?image digest required}
    env_file: ../env-t062/event-service.env
    mem_limit: 1g
    volumes:
      - /opt/flash-ticket-app/rca-faults/event-service/control:/run/fault-control:ro
      - /opt/flash-ticket-app/rca-faults/event-service/audit:/run/fault-audit:rw
