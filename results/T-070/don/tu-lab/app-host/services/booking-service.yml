services:
  booking-service:
    extends:
      file: _common.yml
      service: common
    image: ${IMAGE:?image digest required}
    env_file: ../env-t062/booking-service.env
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - /opt/flash-ticket-app/rca-faults/booking-service/control:/run/fault-control:ro
      - /opt/flash-ticket-app/rca-faults/booking-service/audit:/run/fault-audit:rw
