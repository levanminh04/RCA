# T-076 bước 4 bản 6: Booking (image từ nhánh, cấu hình K8s bản 6) → otel-collector thử. Hạ tầng giả, dữ liệu giả.
name: pr17-agent-v6
services:
  pg:
    image: postgres:16.15
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_admin
      POSTGRES_PASSWORD: thu
    volumes:
      - ../agent/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "booking_admin", "-d", "booking_db"]
      interval: 3s
      retries: 30
  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--requirepass", "thu"]
  rabbit:
    image: rabbitmq:4.3.6-management
    user: "999:999"  # chạy thẳng bằng user rabbitmq: tránh lỗi đọc .erlang.cookie (eacces) gặp trên laptop
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30
  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./collector-http.yaml:/etc/otelcol/collector.yaml:ro
      - ${WORK:?}/out:/out
    user: "0:0"
  booking:
    image: pr17-thu/booking-service:${SERVICE_VERSION:?}
    mem_limit: 768m  # bằng limits.memory của deploy/k8s/booking-service/deployment.yaml
    env_file: ${WORK:?}/booking.env
    ports:
      - "127.0.0.1:18082:8082"
    depends_on:
      pg: {condition: service_healthy}
      rabbit: {condition: service_healthy}
      redis: {condition: service_started}
      otel-collector: {condition: service_started}
